name: Arena Leaderboard Notifier

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Take screenshot of Arena Leaderboard
        run: |
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const c=await b.newContext({viewport:{width:1440,height:900},deviceScaleFactor:2});const p=await c.newPage();await p.goto('https://arena.ai/leaderboard',{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(3000);await p.screenshot({path:'arena.png',fullPage:true});await b.close();})();"

      - name: Upload screenshot to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          FILE_SIZE=$(stat -c%s arena.png)
          GET_URL_RES=$(curl -sS -G "https://slack.com/api/files.getUploadURLExternal" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data-urlencode "filename=arena.png" \
            --data-urlencode "length=$FILE_SIZE")
          UPLOAD_URL=$(echo "$GET_URL_RES" | jq -r .upload_url)
          FILE_ID=$(echo "$GET_URL_RES" | jq -r .file_id)
          curl -sS -o /dev/null -X POST "$UPLOAD_URL" -F "file=@arena.png"
          COMPLETE_OK=$(curl -sS -X POST "https://slack.com/api/files.completeUploadExternal" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "{\"files\":[{\"id\":\"$FILE_ID\",\"title\":\"Arena Leaderboard\"}],\"channel_id\":\"$SLACK_CHANNEL_ID\",\"initial_comment\":\"[chart] Arena Leaderboard 更新チェック https://arena.ai/leaderboard\"}" | jq -r .ok)
          echo "slack_upload_ok=$COMPLETE_OK"
          test "$COMPLETE_OK" = "true"          
