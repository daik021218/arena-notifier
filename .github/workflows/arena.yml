name: Arena Leaderboard Notifier

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日UTC 0:00 = 日本時間9:00
  workflow_dispatch:      # 手動実行ボタンも有効化

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack (text only)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          curl -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "{\"channel\":\"$SLACK_CHANNEL_ID\",\"text\":\"[chart] Arena Leaderboard 更新チェック https://arena.ai/leaderboard\"}" \
            https://slack.com/api/chat.postMessage
